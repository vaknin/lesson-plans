/* =====================================================================
   LOOK: "Sam's craft table". The lesson happens on a green cutting mat; every card is a
   cut-out of white paper held down with yellow tape. Three characters carry the lesson:
   Sam (coral sweater, gold backpack), the snake (green, lime belly) and the paper star (gold).
   Colour roles: green = the snake, the letter S and "right"; gold = the star, the spotlight, "now";
   coral = Sam and the teacher's actions; red = only STOP; ink navy = text and outlines.
   ===================================================================== */
:root{
  --ink:#1c2541; --ink2:#4b5675; --mat:#e3f2e8; --line:#d2e8da; --line2:#bcdcc8;
  --green:#3bb560; --greenD:#23864a; --lime:#dcf57e; --limeD:#b9dc4f;
  --gold:#ffc93c; --goldD:#e8a200; --goldL:#fff1c2;
  --coral:#ff6b4a; --coralD:#d94b2c; --coralL:#ffe3dc;
  --red:#e4343d; --sky:#59a8ff; --skyL:#e3f0ff;
  --tape:rgba(255,212,84,.82);
  --shadow:0 5px 0 rgba(35,134,74,.14),0 22px 38px -20px rgba(28,37,65,.5);
  --r:clamp(18px,3vmin,30px);
  --topH:clamp(64px,9.4vh,92px);
  --sp:1;
  --f:"Fredoka","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --he:"Rubik","Segoe UI",Arial,sans-serif;
  --pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:var(--f);font-weight:500;color:var(--ink);background-color:var(--mat);
  background-image:linear-gradient(var(--line2) 2px,transparent 2px),linear-gradient(90deg,var(--line2) 2px,transparent 2px),
    linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:240px 240px,240px 240px,48px 48px,48px 48px;background-position:-1px -1px;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
[hidden]{display:none!important}
.he{font-family:var(--he);font-weight:500;color:var(--ink2);font-size:clamp(17px,2.8vh,28px);line-height:1.35;margin:0;text-align:center}
.he .en{font-family:var(--f);font-weight:600;color:var(--ink);direction:ltr;unicode-bidi:isolate}

/* ---------- top bar ---------- */
#top{height:var(--topH);flex:none;display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:0 clamp(12px,1.6vw,26px);
  background:rgba(255,255,255,.92);box-shadow:0 3px 0 var(--line2);position:relative;z-index:6}
#logo{width:calc(var(--topH) - 18px);height:calc(var(--topH) - 18px);flex:none}
#stageTitle{flex:1;min-width:0;display:flex;align-items:center;gap:14px;font-weight:600;font-size:clamp(20px,3.5vh,34px);white-space:nowrap}
#stNum{flex:none;display:grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 .3em;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:.9em}
#stName{overflow:hidden;text-overflow:ellipsis}
#agenda{display:flex;gap:clamp(6px,.7vw,12px);flex:none}
.agi{position:relative;width:calc(var(--topH) - 28px);height:calc(var(--topH) - 28px);border:0;padding:0;cursor:pointer;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--line2);display:grid;place-items:center;transition:transform .3s var(--pop),background .3s}
.agi svg{width:66%;height:66%}
.agi.cur{box-shadow:inset 0 0 0 4px var(--gold),0 0 0 5px rgba(255,201,60,.35);transform:scale(1.1)}
.agi.done{background:var(--lime);box-shadow:inset 0 0 0 3px var(--limeD)}
.agi .tk{position:absolute;right:-5px;bottom:-5px;width:46%;height:46%;border-radius:50%;background:var(--green);display:none;place-items:center;box-shadow:0 0 0 3px #fff}
.agi .tk svg{width:70%;height:70%}
.agi.done .tk{display:grid;animation:pop .45s var(--pop)}
.tb{display:flex;gap:10px;flex:none}
.ib{width:calc(var(--topH) - 22px);height:calc(var(--topH) - 22px);min-width:48px;min-height:48px;border-radius:16px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #0b1027;transition:transform .1s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1027}
.ib svg{width:50%;height:50%}

/* ---------- the stage area ---------- */
#screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,20px);padding:clamp(12px,2.4vh,28px) clamp(16px,3vw,56px) clamp(30px,5vh,52px)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);position:relative}
.tape::before,.tape::after{content:"";position:absolute;z-index:2;width:clamp(52px,8vmin,92px);height:clamp(18px,2.8vmin,28px);top:calc(clamp(8px,1.3vmin,13px) * -1);background:var(--tape);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px);border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.tape::before{left:clamp(12px,3vmin,32px);transform:rotate(-7deg)}
.tape::after{right:clamp(12px,3vmin,32px);transform:rotate(6deg)}
.w{font-weight:700;letter-spacing:.01em;line-height:1}
.sl{color:var(--greenD);background:linear-gradient(transparent 56%,var(--lime) 56%,var(--lime) 90%,transparent 90%);border-radius:.08em;padding:0 .02em}
.dots{position:absolute;left:50%;bottom:clamp(8px,1.8vh,18px);transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.dots i{width:14px;height:14px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 3px var(--line2);transition:all .25s}
.dots i.on{width:38px;background:var(--gold);box-shadow:none}
.dots i.ok{background:var(--green);box-shadow:none}
.dots i.eye{box-shadow:inset 0 0 0 3px var(--coral)}
.dots i.eye.on{background:var(--coral)}
.btn{min-height:56px;min-width:56px;padding:0 1.1em;border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:600;font-size:clamp(20px,3.2vh,32px);display:inline-flex;align-items:center;justify-content:center;gap:.4em;box-shadow:0 5px 0 var(--greenD);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--greenD)}
.btn svg{width:1.2em;height:1.2em}
.btn.ink{background:var(--ink);box-shadow:0 5px 0 #0b1027}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--goldD)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line2),inset 0 0 0 3px var(--line2)}
.spk{width:clamp(56px,9vh,84px);height:clamp(56px,9vh,84px);padding:0;flex:none}
.spk svg{width:52%;height:52%}
.cue{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.cue .en{font-weight:600;font-size:clamp(22px,3.8vh,38px)}
.cue .ic{width:clamp(36px,5.6vh,54px);height:clamp(36px,5.6vh,54px);flex:none}

/* picture cards: one thing each, the word below when the stage shows words */
.pcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6%;position:relative}
.pcard .pic{width:100%;flex:1;min-height:0;display:grid;place-items:center}
.pcard .pic svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(28,37,65,.10))}
.pcard .pw{font-weight:700;font-size:clamp(24px,4.4vh,46px);line-height:1;margin-top:6%}
.pcard.ring{box-shadow:0 0 0 6px var(--gold),var(--shadow)}
.pcard.right{box-shadow:0 0 0 7px var(--green),var(--shadow)}
.pcard.dim{opacity:.32;filter:grayscale(.6)}

/* speech bubbles */
.bub{position:relative;background:#fff;border:0;border-radius:28px;padding:.32em .8em;font-weight:600;font-size:clamp(26px,5vh,52px);line-height:1.1;box-shadow:inset 0 0 0 4px var(--ink),0 6px 0 rgba(28,37,65,.12);min-height:56px;color:var(--ink)}
.bub.q{background:var(--goldL)}
.bub.yes{background:#e3f7e9}
.bub.no{background:#ffe9e5}
.bub small{display:block;font-size:.5em;font-weight:500;color:var(--ink2);margin-top:.2em}
.bub.lit{box-shadow:inset 0 0 0 5px var(--green),0 0 0 8px rgba(59,181,96,.25),0 6px 0 rgba(28,37,65,.12);transform:scale(1.04)}
.bub.off{opacity:.3}
.bub.ghost{background:transparent;box-shadow:inset 0 0 0 4px var(--ink2);border:0;color:var(--ink2);outline:3px dashed transparent}
.easy{font-weight:500;color:var(--ink2);font-size:clamp(18px,3vh,30px)}

/* motion */
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(24px);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideIn{0%{transform:translateX(60%) rotate(4deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-12px) rotate(-3deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%,100%{transform:none}35%{transform:translateY(-14px) scale(1.04)}65%{transform:translateY(3px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes slither{0%{transform:translateX(-115vw)}100%{transform:none}}
@keyframes sss{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(60px,-30px) scale(1.3)}}
@keyframes point{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pop{animation:pop calc(var(--sp) * .45s) var(--pop) both}
.rise{animation:rise calc(var(--sp) * .5s) var(--pop) both}
.shake{animation:shake calc(var(--sp) * .45s) both}
.bounce{animation:bounce calc(var(--sp) * .55s) both}
.wig{animation:wiggle calc(var(--sp) * 2.4s) ease-in-out infinite;transform-origin:50% 80%}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}


/* ---------- 1 Good morning ---------- */
.morning{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4vw;max-width:1500px;width:100%}
.morning .sun{width:min(30vw,48vh)}
.morning h1{margin:0;font-size:clamp(46px,10vh,104px);font-weight:700;line-height:1}
.morning .q{margin:.35em 0 0;font-size:clamp(30px,6vh,62px);font-weight:600}
.datecard{display:inline-flex;flex-direction:column;margin-top:4vh;padding:2.4vh 3vw 2.6vh;transform:rotate(-1.5deg)}
.datecard .dd{font-size:clamp(44px,9vh,92px);font-weight:700;color:var(--coralD);line-height:1}
.datecard .dm{font-size:clamp(24px,4.4vh,44px);font-weight:600;color:var(--ink2);margin-top:.2em}

/* ---------- 2 Snake reveal ---------- */
.reveal{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
.lane{width:min(82vw,130vh);position:relative}
.lane .slither{animation:slither calc(var(--sp) * 2.6s) cubic-bezier(.2,.7,.25,1) both}
.lane svg{width:100%;height:auto}
.reveal .asks{display:flex;gap:3vw;align-items:center}
.reveal .asks .bub{font-size:clamp(34px,7vh,72px)}
.letter{display:flex;align-items:center;gap:4vw}
.letter .big{font-size:clamp(150px,36vh,360px);font-weight:700;color:var(--greenD);line-height:.9;text-shadow:0 8px 0 var(--lime)}
.letter .coil{width:min(34vw,52vh)}
.today{font-size:clamp(34px,7vh,72px);font-weight:700;margin:0;text-align:center}
.board{display:grid;grid-template-columns:auto 1fr;gap:3vh 3vw;align-items:center;width:min(92vw,1500px);padding:4vh 3.4vw}
.board .topic{display:flex;align-items:center;gap:1.4vw}
.board .topic svg{width:min(12vw,17vh)}
.board .topic b{font-size:clamp(40px,8vh,82px);display:block;line-height:1}
.board .kick{display:block;font-size:clamp(16px,2.6vh,26px);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--greenD)}
.board .goal{display:flex;align-items:center;gap:1.4vw;background:var(--goldL);border-radius:22px;padding:2vh 2vw}
.board .goal .ic{width:clamp(48px,8vh,80px);flex:none}
.board .goal b{font-size:clamp(28px,5vh,52px);display:block;line-height:1.1}
.board .goal .he{text-align:start}
.agbig{grid-column:1/-1;display:flex;justify-content:space-between;gap:1vw;counter-reset:ag}
.agb{flex:1;display:flex;flex-direction:column;align-items:center;gap:1vh;position:relative}
.agb .ci{width:min(9vw,13vh);height:min(9vw,13vh);border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px var(--line2);display:grid;place-items:center;position:relative}
.agb .ci>svg{width:64%;height:64%}
.agb span{font-weight:600;font-size:clamp(17px,2.8vh,28px);text-align:center;line-height:1.1}
.agb.done .ci{background:var(--lime);box-shadow:inset 0 0 0 4px var(--limeD)}
.agb .tk{position:absolute;right:-4px;bottom:-4px;width:40%;height:40%;border-radius:50%;background:var(--green);display:none;place-items:center;box-shadow:0 0 0 4px #fff}
.agb .tk svg{width:70%;height:70%}
.agb.done .tk{display:grid;animation:pop .45s var(--pop)}

/* ---------- 3 + 9 the story ---------- */
.story{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:2.6vw;align-items:center;width:100%;height:100%;max-width:1760px}
.panel{overflow:hidden;padding:0;aspect-ratio:400/260;width:100%;max-height:100%;justify-self:center;border-radius:var(--r)}
.panel>svg{width:100%;height:100%;border-radius:var(--r)}
.tell{display:flex;flex-direction:column;gap:2.4vh;align-items:flex-start;min-width:0}
.sline{margin:0;font-size:clamp(30px,6.2vh,64px);font-weight:600;line-height:1.3}
.hw{font:inherit;font-weight:700;background:var(--lime);border:0;border-radius:.3em;padding:0 .22em .04em;box-shadow:0 .08em 0 var(--limeD);color:var(--ink);min-height:48px}
.hw .sl{background:none}
.wcard{display:flex;align-items:center;gap:1.2vw;padding:1.4vh 1.4vw;border:0;font:inherit;cursor:pointer;text-align:start}
.wcard .wp{width:clamp(70px,13vh,130px);height:clamp(70px,13vh,130px);flex:none}
.wcard .wt b{display:block;font-size:clamp(32px,6.4vh,64px);font-weight:700;line-height:1}
.wcard .gest{display:flex;align-items:center;gap:.5em;font-size:clamp(18px,2.9vh,29px);font-weight:500;color:var(--ink2);margin-top:.45em}
.wcard .gest svg{width:2.6em;height:2.6em;flex:none;background:#eef7f1;border-radius:50%;padding:.2em}
.wcard .he{text-align:start;margin-top:.15em}
.who{display:flex;gap:10px}
.who b{min-height:52px;display:flex;align-items:center;gap:.35em;padding:0 .7em;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 3px var(--line2);font-size:clamp(19px,3vh,30px);font-weight:600;transition:all .2s}
.who b svg{width:1.4em;height:1.4em}
.who b.on{background:var(--gold);box-shadow:0 4px 0 var(--goldD);transform:translateY(-3px)}
.who b.done{background:var(--lime);box-shadow:inset 0 0 0 3px var(--limeD)}
.theend{display:flex;align-items:center;gap:.6em;font-size:clamp(24px,4vh,40px);font-weight:600;color:var(--greenD)}
.theend svg{width:1.6em;height:1.6em}
.sssbtn{min-height:clamp(70px,13vh,120px);padding:0 1.2em 0 .5em;font-size:clamp(34px,7vh,70px);border-radius:999px}
.sssbtn svg{width:1.7em;height:1.7em}
.sssfly{position:absolute;font-weight:700;color:var(--greenD);font-size:clamp(40px,8vh,80px);pointer-events:none;animation:sss calc(var(--sp) * 1s) ease-out both}

/* ---------- 4 Stop me when… ---------- */
.stopme{position:relative;width:100%;height:100%;display:grid;place-items:center}
.stopme .big{width:min(58vh,46vw);height:min(58vh,46vw)}
.stopme .ready{width:min(58vh,46vw);height:min(58vh,46vw);display:grid;place-items:center;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);background-image:radial-gradient(circle,var(--lime) 0 18%,transparent 19%);background-size:44px 44px}
.stopme .ready svg{width:46%}
.hint .en{font-size:clamp(26px,4.6vh,46px);font-weight:700;color:var(--ink)}
.hint{position:absolute;right:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:22px}
.hint .pic{width:clamp(74px,13vh,128px);height:clamp(74px,13vh,128px)}
.hint .palm{width:clamp(38px,6vh,60px)}
.stopme .spkc{position:absolute;left:0;top:0}
.rounds{position:absolute;left:0;bottom:0;display:flex;gap:10px}
.rounds i{width:clamp(34px,5vh,48px);height:clamp(34px,5vh,48px);border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--line2);display:grid;place-items:center}
.rounds i svg{width:62%}
.rounds i.on{box-shadow:inset 0 0 0 4px var(--gold)}
.rounds i.ok{background:var(--lime);box-shadow:inset 0 0 0 3px var(--limeD)}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:8}
.burst svg{width:min(72vh,60vw);animation:burst calc(var(--sp) * 1.3s) var(--pop) both}
@keyframes burst{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.08) rotate(-6deg);opacity:1}80%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(1.15) rotate(-6deg);opacity:0}}

/* ---------- 5 What's missing? ---------- */
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.4vh,26px);height:100%;max-height:calc(100vh - var(--topH) - 160px);aspect-ratio:3/2.05}
.grid6 .slot{position:relative;min-height:0}
.grid6 .pcard{width:100%;height:100%}
.grid6 .hole{width:100%;height:100%;border-radius:var(--r);border:5px dashed var(--ink2);display:grid;place-items:center;font-size:clamp(60px,14vh,140px);font-weight:700;color:var(--ink2);background:rgba(255,255,255,.4)}
.mrow{display:flex;gap:2vw;align-items:center;min-height:clamp(62px,9vh,90px)}
.eyes{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;color:#fff;animation:fadein calc(var(--sp) * .3s) both}
.eyes svg{width:min(40vw,40vh)}
.eyes b{font-size:clamp(50px,11vh,110px)}
.eyes .he{color:#d8def0}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- 6 Read with me ---------- */
.readc{display:grid;grid-template-columns:auto auto;align-items:center;gap:4vw;padding:4vh 5vw;border:0;font:inherit;cursor:pointer}
.readc .pic{width:min(50vh,36vw);height:min(50vh,36vw)}
.readc .w{font-size:clamp(80px,19vh,190px)}
.readc .row{display:flex;flex-direction:column;align-items:flex-start;gap:4vh}

/* ---------- 7 Which word? ---------- */
.which{display:flex;flex-direction:column;align-items:center;gap:clamp(64px,11vh,110px);width:100%}
.wopts{display:flex;gap:3vw;justify-content:center;width:100%}
.wopt{position:relative;flex:1;max-width:30vw;min-height:clamp(150px,30vh,300px);border:0;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:2.4vh 1vw 3vh;gap:1.4vh;transition:transform .2s,opacity .3s}
.wopt .w{font-size:clamp(54px,12vh,124px)}
.wopt .rv{display:none;align-items:center;gap:1vw}
.wopt .rv .pic{width:clamp(80px,15vh,150px);height:clamp(80px,15vh,150px)}
.wopt .rv .g{width:clamp(48px,8vh,80px)}
.wopt.right .rv{display:flex;animation:pop calc(var(--sp) * .45s) var(--pop) both}
.wopt.right{box-shadow:0 0 0 7px var(--green),var(--shadow)}
.wopt.dim{opacity:.3}
.wopt.sel{box-shadow:0 0 0 6px var(--gold),var(--shadow)}
.pointer{position:absolute;top:calc(clamp(60px,10vh,100px) * -.85);left:50%;width:clamp(60px,10vh,100px);margin-left:calc(clamp(60px,10vh,100px) * -.5);animation:point calc(var(--sp) * 1s) ease-in-out infinite;z-index:3}
.wopt .num{position:absolute;left:14px;top:12px;width:clamp(44px,7vh,68px);height:clamp(44px,7vh,68px);border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:700;font-size:clamp(28px,4.8vh,46px);display:grid;place-items:center}

/* ---------- 8 Is it a…? ---------- */
.isit{display:grid;grid-template-columns:1fr auto 1fr;gap:2.6vw;align-items:center;width:100%;max-width:1700px}
.half{display:flex;flex-direction:column;align-items:center;gap:2vh;padding:3vh 1.6vw;border-radius:var(--r);background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 3px var(--line2);transition:transform .4s var(--pop)}
.half .hd{display:flex;align-items:center;gap:.5em;font-size:clamp(28px,5.2vh,52px);font-weight:700}
.isit .bub{font-size:clamp(28px,5.6vh,58px)}
.half .hd svg{width:1.8em;height:1.4em}
.half .bub{width:100%;text-align:center}
.half.asker .hd{color:var(--coralD)}
.half.answer .hd{color:var(--greenD)}
.isit .center{width:min(54vh,30vw);height:min(54vh,30vw)}
.swapflip{animation:pop calc(var(--sp) * .45s) var(--pop) both}

/* ---------- 10 Peek! ---------- */
.peek{display:grid;grid-template-columns:1fr auto 1fr;gap:2.6vw;align-items:center;width:100%;max-width:1700px}
.peekbox{position:relative;width:min(60vh,36vw);height:min(60vh,36vw);overflow:hidden;padding:0}
.peekbox .pic{position:absolute;inset:7%}
.cover{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr)}
.cover i{background:var(--green);box-shadow:inset 0 0 0 2px var(--greenD);transition:transform calc(var(--sp) * .35s) var(--pop),opacity calc(var(--sp) * .35s)}
.cover i:nth-child(odd){background:#46c06b}
.cover i:nth-child(3n){background-image:radial-gradient(circle,var(--lime) 0 18%,transparent 20%)}
.cover i.off{transform:scale(0) rotate(30deg);opacity:0}
.peek .side{display:flex;flex-direction:column;align-items:center;gap:2.4vh}
.peek .bub{font-size:clamp(28px,5.6vh,58px)}
.peek .ctrl{display:flex;gap:14px}
.gap{display:inline-block;min-width:4.2em;border-bottom:.08em solid var(--ink);text-align:center;color:var(--greenD)}

/* ---------- 11 Guess my mime ---------- */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4vw;width:min(94vw,1600px)}
.rule{display:flex;flex-direction:column;align-items:center;gap:1.4vh;padding:3vh 1.4vw 2.6vh}
.rule .n{position:absolute;left:-14px;top:-14px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:28px}
.rule svg.art{width:100%;height:auto;max-height:34vh}
.rule b{font-size:clamp(24px,4.4vh,44px);text-align:center;line-height:1.15}
.rule .role{display:inline-flex;padding:0;background:none;box-shadow:none;vertical-align:-.12em;margin-right:.15em;font-size:1em}
.rule b.he{font-size:clamp(20px,3.2vh,32px)}
.herules{max-width:min(92vw,1500px);padding:2vh 2vw;background:var(--goldL);border-radius:20px}
.mime{display:flex;flex-direction:column;gap:2.2vh;width:min(96vw,1700px);height:100%}
.prompts{display:flex;justify-content:center;gap:2vw;align-items:center}
.prompts .grp{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:24px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 3px var(--line2)}
.prompts .bub{font-size:clamp(22px,4vh,40px)}
.prompts .grp.e .bub{font-size:clamp(20px,3.4vh,34px)}
.tiles6{display:grid;grid-template-columns:repeat(6,1fr);gap:1.4vw;flex:1;min-height:0}
.tiles6 .pcard{border:0;font:inherit;padding:5% 5% 7%}
.tiles6 .gm{position:absolute;left:6px;top:6px;width:30%;background:var(--skyL);border-radius:50%;padding:4px}
.trow{display:flex;align-items:center;gap:1.6vw}
.roles{display:flex;gap:12px}
.role{display:flex;align-items:center;gap:.4em;font-size:clamp(20px,3.4vh,34px);font-weight:600;background:#fff;border-radius:999px;padding:.2em .7em .2em .25em;box-shadow:inset 0 0 0 3px var(--line2)}
.role i{font-style:normal;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.role i.A{background:var(--coral)}
.role i.B{background:var(--sky)}
.tracks{flex:1;display:flex;flex-direction:column;gap:10px}
.track{position:relative;height:clamp(50px,7.4vh,72px);border-radius:999px;background:#fff;box-shadow:inset 0 0 0 3px var(--line2);overflow:hidden;cursor:pointer}
.track .body{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.track .lbl{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:clamp(18px,3vh,30px);color:var(--ink2)}
.track .mk{position:absolute;top:50%;transform:translateY(-50%);height:88%;aspect-ratio:1.4}
.track .mk svg{width:100%;height:100%}
.track.now{box-shadow:inset 0 0 0 4px var(--gold)}
.ttime{display:flex;align-items:center;gap:.4em;font-size:clamp(28px,5vh,50px);font-weight:700;min-width:4.4em}
.ttime svg{width:1em;height:1em}
.swapban{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(28,37,65,.55);animation:fadein calc(var(--sp) * .25s) both}
.swapban .in{display:flex;align-items:center;gap:.4em;font-size:clamp(70px,16vh,160px);font-weight:700;background:#fff;border-radius:40px;padding:.2em .6em;box-shadow:0 0 0 8px var(--gold);animation:pop calc(var(--sp) * .5s) var(--pop) both}
.swapban .in svg{width:1em;height:1em}

/* ---------- 12 Snake chain ---------- */
.chainwrap{display:flex;flex-direction:column;align-items:center;gap:3vh;width:100%}
.chain{position:relative;display:flex;align-items:center;min-height:clamp(150px,27vh,260px)}
.chain .body{position:absolute;left:40px;right:60px;top:50%;height:44%;transform:translateY(-50%);border-radius:999px;background:var(--green);box-shadow:inset 0 0 0 5px var(--ink),inset 0 -14px 0 rgba(35,134,74,.6);
  background-image:radial-gradient(circle,var(--lime) 0 14%,transparent 16%);background-size:36px 36px}
.chain .tail{width:clamp(56px,9vh,90px);position:relative;z-index:1;margin-right:-10px}
.chain .head{width:clamp(130px,23vh,220px);position:relative;z-index:1;margin-left:-14px}
.chain .seg{width:clamp(120px,20vh,190px);height:clamp(140px,24vh,230px);margin:0 6px;position:relative;z-index:1}
.chain .seg .pcard{width:100%;height:100%;animation:pop calc(var(--sp) * .45s) var(--pop) both}
.chain .seg .pw{font-size:clamp(22px,3.8vh,38px)}
.bank{display:flex;gap:14px}
.bank .btn{min-width:56px}
.bank .btn[disabled]{opacity:.3;pointer-events:none}
.learn{display:flex;flex-direction:column;align-items:center;gap:3vh;width:min(94vw,1500px)}
.learn h1{margin:0;font-size:clamp(44px,9vh,92px);font-weight:700}
.learn .ans{margin:0;font-size:clamp(40px,8vh,80px);font-weight:700;color:var(--greenD)}
.bye{display:flex;flex-direction:column;align-items:center;gap:4vh}
.bye h1{margin:0;font-size:clamp(54px,12vh,124px);font-weight:700;text-align:center;line-height:1.05}
.bye svg{height:min(56vh,46vw);width:auto}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:40;background:rgba(28,37,65,.6);display:grid;place-items:center}
#menu .box{width:min(94vw,1200px);max-height:92vh;overflow:auto;padding:3vh 2.6vw}
#menu h2{margin:0 0 2vh;font-size:clamp(26px,4vh,40px);display:flex;align-items:center;gap:14px}
#menu h2 span{flex:1}
#menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mstage{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 12px;border:0;border-radius:16px;background:var(--mat);text-align:start;font-size:clamp(17px,2.6vh,24px);font-weight:600}
.mstage .n{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.mstage small{display:block;font-weight:500;color:var(--ink2);font-size:.8em}
.mstage.cur{background:var(--gold)}
.mfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:2vh}
.mkeys{font-size:clamp(15px,2.2vh,20px);color:var(--ink2);line-height:1.7;margin:2vh 0 0}
.kbd{display:inline-block;min-width:1.6em;padding:0 .4em;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 2px var(--line2);text-align:center;font-weight:600;color:var(--ink)}
#legend{position:fixed;left:12px;bottom:6px;z-index:6;display:flex;gap:14px;font-size:13px;color:var(--ink2);opacity:.6;pointer-events:none}
#legend .kbd{font-size:12px;padding:0 .35em;margin-right:.2em}
#legend .off{opacity:.4;text-decoration:line-through}
#legend.nudge{opacity:1;animation:nudge .45s}
#legend .hot .kbd{background:var(--gold)}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}

/* =====================================================================
   BASICS
   ===================================================================== */
const SPEED = (() => { const m = /[?&]fast=([\d.]+)/.exec(location.search); return m ? +m[1] : 1; })();
document.documentElement.style.setProperty("--sp", SPEED);
const STAGES = LESSON.stages, W = LESSON.words, WIDS = W.map(w => w.id), WB = Object.fromEntries(W.map(w => [w.id, w]));
const T = LESSON.text, H = LESSON.hebrew, S = LESSON.settings;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const restart = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const curly = s => s.replace(/'/g, "’");
// a word with its first S marked
const wHTML = w => w.replace(/^([Ss])/, '<span class="sl">$1</span>');
// the pair-game prompts for one word: easier "Star?", harder "Is it a star?" (S highlighted)
const easyQ = id => wHTML(id.replace(/^./, c => c.toUpperCase())) + "?";
const hardQ = id => curly(LESSON.questions[id]).replace(new RegExp(`\\b${id}\\b`), wHTML(id));
const heLine = (h, cls = "") => `<p class="he ${cls}" dir="rtl" lang="he">${h}</p>`;
window.__sfx = [];

/* =====================================================================
   ART: flat cut-paper shapes, navy ink outline, one highlight each
   ===================================================================== */
const INK = "#1c2541";
const P = { green: "#3bb560", greenD: "#23864a", belly: "#dcf57e", gold: "#ffc93c", goldD: "#e8a200", goldL: "#ffe9a0", coral: "#ff6b4a", skin: "#f6c7a1", hair: "#3a2620", jeans: "#3c6fd8", sky: "#d4eaff", wall: "#ffe3ad", roof: "#e5584c", red: "#e4343d", steel: "#e3eaf2", pink: "#ff9db3", grass: "#a6df86", grassD: "#86cc66", room: "#fff1d6", floor: "#f0d3a4", wood: "#d99a5b", tear: "#59a8ff", blue: "#59a8ff", mouth: "#7a2230" };
const f1 = n => +n.toFixed(1);
const V = (vb, inner, sw = 5, cls = "") => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"${cls ? ` class="${cls}"` : ""}><g stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
const starPts = (cx, cy, R, r = R * .5) => Array.from({ length: 10 }, (_, k) => { const a = (-90 + 36 * k) * Math.PI / 180, q = k % 2 ? r : R; return `${f1(cx + q * Math.cos(a))},${f1(cy + q * Math.sin(a))}`; }).join(" ");
const octPts = (cx, cy, R) => Array.from({ length: 8 }, (_, k) => { const a = (22.5 + 45 * k) * Math.PI / 180; return `${f1(cx + R * Math.cos(a))},${f1(cy + R * Math.sin(a))}`; }).join(" ");

// the paper star (the story's star; no face)
const starG = (cx, cy, R, sw = 6) => `<polygon points="${starPts(cx, cy, R, R * .5)}" fill="${P.gold}" stroke-width="${sw}"/>
  <polygon points="${starPts(cx, cy - R * .05, R * .56, R * .28)}" fill="${P.goldL}" stroke="none"/>
  <path d="M${f1(cx - R * .5)} ${f1(cy - R * .12)} L${f1(cx - R * .3)} ${f1(cy - R * .12)}" stroke="#fff" stroke-width="${f1(sw * .9)}"/>`;
// an open hand, palm out (STOP gesture), drawn in a 100 box around (50,52)
const palmG = (fill = P.skin, sw = 4) => `<g stroke-width="${sw}">
  <rect x="27" y="14" width="11" height="36" rx="5.5" fill="${fill}"/><rect x="39" y="8" width="11" height="40" rx="5.5" fill="${fill}"/>
  <rect x="51" y="10" width="11" height="38" rx="5.5" fill="${fill}"/><rect x="63" y="18" width="10" height="32" rx="5" fill="${fill}"/>
  <path d="M25 44 Q25 88 52 88 Q76 88 76 60 L76 46 Q76 40 70 40 L30 40 Q25 40 25 44 Z" fill="${fill}"/>
  <path d="M28 58 Q14 52 11 40 Q10 33 17 34 Q24 38 30 50" fill="${fill}"/></g>`;
const scissorsG = () => {
  const blade = (p, t, w) => { const dx = t[0] - p[0], dy = t[1] - p[1], L = Math.hypot(dx, dy), nx = -dy / L * w / 2, ny = dx / L * w / 2;

const CV = $("#confetti"), CX = CV.getContext("2d");

function confetti(x = innerWidth / 2, y = innerHeight * .35, n = 140) {
  CV.width = innerWidth; CV.height = innerHeight;
  for (let i = 0; i < n; i++) PARTS.push({ x, y, vx: (Math.random() - .5) * 18, vy: -Math.random() * 15 - 4, s: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: CCOL[i % CCOL.length], star: i % 3 === 0, life: 80 + Math.random() * 60 });

}
function ctick() {
  CX.clearRect(0, 0, CV.width, CV.height);

  for (const p of PARTS) {
    p.vy += .42; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    CX.save(); CX.translate(p.x, p.y); CX.rotate(p.r); CX.fillStyle = p.c; CX.strokeStyle = INK; CX.lineWidth = 1.5;

    else CX.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);

  let step = 0, asked = false, answered = false, qt = null;
  function render() {
    asked = answered = false;
    if (step === 0) {
      el.innerHTML = `<div class="reveal"><div class="lane"><div class="slither">${V("0 0 270 140", snakeH("happy"))}</div></div>
        <div class="asks"><div class="bub q" id="wii" style="visibility:hidden">${T.whatIsIt}</div><div class="bub ghost" id="ans">${T.itsA} <span class="gap">…</span>.</div></div></div>`;
      slide();
    } else if (step === 1) {
      el.innerHTML = `<div class="reveal"><div class="letter"><div class="big">Ss</div><div class="coil wig">${ART.snake()}</div></div>
        <p class="today rise">${T.todayShown.replace("Snake", wHTML("Snake"))}</p></div>`;
      speak(T.today);
    } else {
      el.innerHTML = `<div class="board card tape"><div class="topic">${ART.snake()}<div><span class="kick">Today</span><b>The letter <span class="sl">S</span></b></div></div>
        <div class="goal">${ICON.target.replace("<svg", '<svg class="ic"')}<div><b>${LESSON.goal}</b>${heLine(H.goal)}</div></div>${agendaBig(0)}</div>`;
    }
    setItem(el, step, step === 0 ? "slide" : "");
  }
  function slide() {
    const s = $(".slither", el); restart(s, "slither"); SFX.hiss(2.4);
    qt = sc.after(2500, ask);
  }
  function ask() { sc.clear(qt); const q = $("#wii", el); if (!q || asked) return; asked = true; q.style.visibility = "visible"; restart(q, "pop"); speak(T.whatIsIt); el.dataset.state = "asked"; }
  function answer() { const a = $("#ans", el); a.className = "bub yes pop"; a.innerHTML = `${T.itsA} ${wHTML("snake")}!`; answered = true; el.dataset.state = "answered"; SFX.sparkle(); }
  function hissAgain() { restart($(".slither", el), "slither"); SFX.hiss(2.4); }
  render();
  return {
    keys: () => [["Space", step === 0 ? (!asked ? "What is it?" : !answered ? "It’s a snake!" : "hiss again") : "hiss", step < 2]],
    onKey(k) {
      if (k === " " && step === 0) return (!asked ? ask() : !answered ? answer() : hissAgain()), true;
      if (k === " " && step === 1) { SFX.hiss(1.4); sssFly($(".coil", el), 3); return true; }
      if (k === "ArrowRight" && step < 2) { step++; render(); return true; }
      if (k === "ArrowLeft" && step > 0) { step--; render(); return true; }
    }
  };
};

/* 3. Sam's story: 7 panels told live; each S word highlighted, with picture and gesture; class / girls / boys repeat */
function storyLine(i, highlight) {
  const s = LESSON.story[i]; let t = curly(s.text);
  if (highlight && s.word) t = t.replace(new RegExp(`\\b(${s.word})\\b`, "gi"), m => `<button class="hw" data-say="${s.word}">${wHTML(m)}</button>`);
  return t;
}
GAMES.story = (el, sc) => {
  let i = 0, who = -1, said = false;

      <p class="sline rise">${storyLine(i, true)}</p>
      ${w ? `<button class="wcard card" data-say="${w.id}"><div class="wp">${pic(w.id)}</div><div class="wt"><b class="w">${wHTML(w.id)}</b>
        <div class="gest">${GEST[w.g]()}<span>${w.gesture}</span></div>${heLine(w.he)}</div></button>
      <div class="who">${[["cls", "Everybody"], ["girls", "Girls"], ["boys", "Boys"]].map(([k, n], j) => `<b class="${j === who ? "on" : j < who ? "done" : ""}">${PEOPLE[k]}${n}</b>`).join("")}</div>`

    $$("[data-say]", el).forEach(b => b.onclick = () => { speak(b.dataset.say); restart($(".wcard", el), "bounce"); });
    $(".panel", el).onclick = () => { if (s.word === "snake") SFX.hiss(1.6); };
    setItem(el, i, who >= 0 ? "repeat" + who : said ? "said" : "");

    if (s.word === "scissors") sc.after(500, () => SFX.snip());

  const move = d => { const n = i + d; if (n < 0 || n > 6) return false; i = n; who = -1; said = false; render(); return true; };
  // Space: the word → Everybody → Girls → Boys → the word again; every press plays the word
  function space(w) {

    onKey(k) {

  };
};

/* 4. Stop me when…: the teacher plays the target word (Space, never by itself); single pictures; the class shouts Stop! at the target (S). → next picture, ← previous */
GAMES.stopme = (el, sc) => {
  const targets = S.stopTargets;
  let r = 0, seq = [], pos = -1, stopped = false;
  function makeRun(t) {
    const others = WIDS.filter(w => w !== t), out = [];
    for (let lap = 0; lap < 4; lap++) { const n = 2 + (Math.random() * 3 | 0); let last = out[out.length - 1]; for (let k = 0; k < n; k++) { const pick = shuffle(others.filter(o => o !== last))[0]; out.push(pick); last = pick; } out.push(t); }
    return out;
  }
  function render() {
    const cur = pos >= 0 ? seq[pos] : null;
    el.innerHTML = `<div class="stopme">
      <button class="btn spk spkc" aria-label="Say the word">${ICON.speaker}</button>
      <div class="hint card"><div class="palm">${ICON.ear}</div><span class="en">Listen!</span></div>
      ${cur ? pcard(cur, { cls: "big " + (stopped ? "right" : ""), extra: "" }) : `<div class="ready">${ICON.ear}</div>`}
      <div class="rounds">${targets.map((t, k) => `<i class="${k === r ? "on" : k < r ? "ok" : ""}">${k < r ? ART[t]() : ""}</i>`).join("")}</div>
      ${heLine(H.stopme, "").replace('class="he "', 'class="he" style="position:absolute;right:0;bottom:0"')}</div>`;
    $(".spkc", el).onclick = () => speak(targets[r]);
    if (cur) restart($(".pcard", el), "slideIn");
    el.dataset.target = targets[r]; el.dataset.round = r;
    setItem(el, pos, pos < 0 ? "ready" : stopped ? "stopped" : "run");
  }
  function newRound() { seq = makeRun(targets[r]); pos = -1; stopped = false; render(); }
  function advance() {
    if (stopped) { if (r >= targets.length - 1) return false; r++; newRound(); return true; }
    if (pos >= seq.length - 1) seq.push(...makeRun(targets[r]));
    pos++; render(); SFX.whoosh(); return true;
  }
  function back() { if (pos < 0) return false; pos--; stopped = false; render(); return true; }
  function stop() {
    if (pos < 0 || stopped) return false;
    const b = document.createElement("div"); b.className = "burst"; b.innerHTML = BURST; el.appendChild(b);
    SFX.stop(); sc.after(1300, () => b.remove());
    if (seq[pos] === targets[r]) { stopped = true; const rr = r, pp = pos; sc.after(700, () => { if (r !== rr || pos !== pp || !stopped) return; render(); SFX.sparkle(); }); }
    el.dataset.burst = String(+(el.dataset.burst || 0) + 1);
    return true;
  }
  newRound();
  return {
    keys: () => [["Space", "hear the word", true], ["S", "STOP!", pos >= 0 && !stopped]],
    onKey(k) {
      if (k === " ") return speak(targets[r]), true;
      if (k === "s") return stop();
      if (k === "ArrowRight") return advance();
      if (k === "ArrowLeft") return back();
    }
  };
};

/* 5. What's missing?: 6 pictures → close your eyes → one vanishes → What's missing? → reveal */
GAMES.missing = (el, sc) => {
  const rounds = S.missingRounds, order = shuffle(WIDS);
  let r = 0, phase = "look";
  function render() {
    const t = rounds[r];
    el.innerHTML = `<div class="grid6">${order.map(id => `<div class="slot" data-word="${id}">${id === t && phase === "open" ? `<div class="hole">?</div>` : pcard(id, { cls: id === t && phase === "revealed" ? "ring pop" : "" })}</div>`).join("")}</div>
      <div class="mrow">${phase === "open" ? `<div class="bub q pop">${curly(T.whatsMissing)}</div>` : ""}
        ${phase === "revealed" ? `<div class="bub yes pop" data-say="${t}">${wHTML(t.replace(/^./, c => c.toUpperCase()))}!</div>${LESSON.itsA[t] ? `<div class="bub yes pop" data-say="${LESSON.itsA[t]}">${curly(LESSON.itsA[t]).replace(t, wHTML(t)).replace(/\.$/, "!")}</div>` : ""}` : ""}</div>

  }

  }

    el.innerHTML = `<div class="isit">${halfHTML(left, qid)}${pcard(pid, { cls: "center rise" })}${halfHTML(left === "ask" ? "answer" : "ask", qid)}</div>${heLine(H.isit)}${dotsHTML(items.length, i, i)}`;

};

GAMES.peek = (el, sc) => {
  const order = shuffle(WIDS); let i = 0, running = false, timer = null;
  function render() {
    stopRun();
    const id = order[i], tiles = shuffle([...Array(25).keys()]);
    el.innerHTML = `<div class="peek"><div class="side"><div class="bub q">Is it a <span class="gap" style="min-width:2.4em">…</span>?</div></div>

  }
  function step() {

    timer = sc.after(S.peekStepMs, step);
  }
  function toggle() { if (el.dataset.state === "revealed") return false; if (running) { stopRun(); el.dataset.state = "paused"; return true; } running = true; el.dataset.state = "peeking"; $("#pk", el).innerHTML = ICON.pause; step(); return true; }
  function stopRun() { running = false; if (timer) sc.clear(timer); timer = null; const b = $("#pk", el); if (b) b.innerHTML = ICON.play; }

      if (k === "ArrowLeft") { if (i <= 0) return false; i--; render(); return true; }
    },
    stop: stopRun
  };
};

/* 11. Guess my mime (pairs): how to play, then 6 pictures, the prompts and two 1:45 halves on a left→right snake timer */
const countdown = (sc, seconds, onTick, onEnd) => {
  let left = seconds * 1000, running = false, last = null, ended = false;
  const api = {
    get running() { return running; }, get ended() { return ended; },
    toggle() { if (ended) return; running = !running; last = null; if (running) sc.frame(loop); },
    finish() { running = false; left = 0; ended = true; onTick(0, 1); onEnd(); }
  };
  function loop(ts) {
    if (!running) return false;
    if (last !== null) left -= (ts - last) / SPEED; last = ts;
    if (left <= 0) { left = 0; running = false; ended = true; onTick(0, 1); onEnd(); return false; }
    onTick(left, 1 - left / (seconds * 1000));
  }
  onTick(left, 0);
  return api;
};
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${s / 60 | 0}:${String(s % 60).padStart(2, "0")}`; };

      el.innerHTML = `<div class="rules">
        <div class="rule card"><i class="n">1</i>${V("0 0 220 190", `<g transform="translate(80 184) scale(.96)">${kid(P.coral, P.hair, "shh")}</g><path d="M128 24 H204 Q212 24 212 32 V92 Q212 100 204 100 H150 L138 116 L140 100 H128 Q120 100 120 92 V32 Q120 24 128 24 Z" fill="#fff" stroke-width="4"/><g transform="translate(140 30) scale(.32)">${starG(100, 106, 88, 12)}</g><circle cx="122" cy="122" r="5" fill="#fff" stroke-width="3"/>`, 5, "art")}<b><span class="role"><i class="A">A</i></span> Pick a word. Shh!</b></div>
        <div class="rule card"><i class="n">2</i>${V("0 0 220 190", `<g transform="translate(70 184) scale(.96)">${kid(P.blue, "#8a5a2b", "wow")}</g><path d="M112 20 H208 Q216 20 216 28 V70 Q216 78 208 78 H130 L118 94 L120 78 H112 Q104 78 104 70 V28 Q104 20 112 20 Z" fill="${P.goldL}" stroke-width="4"/><text x="160" y="58" text-anchor="middle" font-family="Fredoka,Arial" font-weight="700" font-size="24" fill="${INK}" stroke="none">Is it…?</text>`, 5, "art")}<b><span class="role"><i class="B">B</i></span> Is it a star?</b></div>
        <div class="rule card"><i class="n">3</i>${V("0 0 220 190", `<g transform="translate(60 184) scale(.9)">${kid(P.coral, P.hair, "grin", "up")}</g><g transform="translate(160 184) scale(.9)">${kid(P.blue, "#8a5a2b", "grin", "up")}</g>${spark(110, 40, 1.4)}${spark(30, 30, .9)}${spark(196, 36, .9)}`, 5, "art")}<b>${curly(T.yes)} Mime!</b></div></div>
        <div class="herules" ${heShown ? "" : "hidden"}>${heLine(H.rules)}</div>
        <button class="btn white" id="heb"><span dir="rtl" lang="he" style="font-family:var(--he)">בעברית?</span></button>`;
      $("#heb", el).onclick = toggleHe;
      setItem(el, 0, heShown ? "hebrew" : "rules");
    } else {
      el.innerHTML = `<div class="mime">
        <div class="prompts"><div class="grp e"><span class="bub q" id="qe">${easyQ("star")}</span><span class="bub yes">Yes!</span><span class="bub no">No!</span></div>
          <div class="grp"><button class="bub q" id="qh" data-say="${LESSON.questions.star}"><span>${hardQ("star")}</span></button><button class="bub yes" data-say="${T.yes}">${curly(T.yes)}</button><button class="bub no" data-say="${T.no}">${curly(T.no)}</button></div></div>
        <div class="tiles6">${WIDS.map(id => pcard(id, { label: true, tag: "button", extra: `<div class="gm">${GEST[WB[id].g]()}</div>` })).join("")}</div>
        <div class="trow"><div class="roles"></div><div class="tracks">${[0, 1].map(h => `<div class="track" data-half="${h}" dir="ltr"><svg class="body" aria-hidden="true"></svg><span class="lbl">${h + 1}</span><div class="mk">${V("0 0 140 100", `<path d="M126 56 H138 M134 56 l5 -5 M134 56 l5 5" fill="none" stroke="${P.red}" stroke-width="3.5"/><ellipse cx="90" cy="52" rx="40" ry="32" fill="${P.green}" stroke-width="6"/><circle cx="96" cy="42" r="10" fill="#fff" stroke-width="4"/><circle cx="99" cy="43" r="4.5" fill="${INK}" stroke="none"/><path d="M98 66 Q110 72 120 62" fill="none" stroke-width="4"/>`, 5)}</div></div>`).join("")}</div>
        <div class="ttime">${ICON.clock}<span></span></div></div></div>`;
      $$("[data-say]", el).forEach(b => b.onclick = () => speak(b.dataset.say));
      // tapping a picture: hear it, and the prompts show the question for that word (for the demo)
      $$(".tiles6 .pcard", el).forEach(b => b.onclick = () => { const id = b.dataset.word; speak(id); restart(b, "bounce"); $("#qe", el).innerHTML = easyQ(id); const q = $("#qh", el); q.dataset.say = LESSON.questions[id]; q.innerHTML = `<span>${hardQ(id)}</span>`; restart(q, "pop"); });
      $$(".track", el).forEach(t => t.onclick = toggle);
      half = 0; newTimer(); setItem(el, 1, "ready");
    }
  }
  function toggleHe() { heShown = !heShown; $(".herules", el).hidden = !heShown; el.dataset.state = heShown ? "hebrew" : "rules"; }
  function roles() { const [a, b] = half ? ["B", "A"] : ["A", "B"]; $(".roles", el).innerHTML = `<span class="role"><i class="${a}">${a}</i>picks</span><span class="role"><i class="${b}">${b}</i>asks</span>`; }
  // the timer is a snake: the head slides left → right, the body (a wave, tapering to the tail) grows behind it
  function place(h, p) {
    const t = $$(".track", el)[h]; if (!t) return; const mk = $(".mk", t), W = t.clientWidth, Ht = t.clientHeight, end = W - mk.offsetWidth - 8, x = 8 + Math.max(0, end - 8) * p;
    mk.style.left = x.toFixed(1) + "px";
    const sv = $(".body", t), x0 = 10, xe = x + mk.offsetWidth * .4, mid = Ht / 2, A = Ht * .12, bw = Ht * .44, lam = Ht * 2.4;
    sv.setAttribute("viewBox", `0 0 ${W} ${Ht}`);
    if (xe - x0 < 6) { sv.innerHTML = ""; return; }
    const y = s => mid + A * Math.sin(2 * Math.PI * (s - xe) / lam), w = s => bw * Math.min(1, .15 + (s - x0) / (Ht * 1.6)), top = [], bot = [], dots = [];
    for (let s = x0; ; s = Math.min(xe, s + 6)) { top.push(`${s.toFixed(1)},${(y(s) - w(s) / 2).toFixed(1)}`); bot.unshift(`${s.toFixed(1)},${(y(s) + w(s) / 2).toFixed(1)}`); if (s >= xe) break; }
    for (let s = xe - Ht * .7; s > x0 + Ht * .5; s -= Ht * .55) dots.push(`<circle cx="${s.toFixed(1)}" cy="${y(s).toFixed(1)}" r="${(w(s) * .17).toFixed(1)}"/>`);
    sv.innerHTML = `<polygon points="${top.join(" ")} ${bot.join(" ")}" fill="${P.green}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><g fill="${P.belly}">${dots.join("")}</g>`;
  }
  function newTimer() {
    roles(); $$(".track", el).forEach((t, k) => t.classList.toggle("now", k === half));
    if (half === 1) place(0, 1); place(1, 0); place(0, half ? 1 : 0);
    timer = countdown(sc, S.mimeHalfSeconds, (ms, p) => { place(half, p); const s = $(".ttime span", el); if (s) s.textContent = mmss(ms); }, endHalf);
    el.dataset.half = half;
  }
  function banner(txt, icon) { const b = document.createElement("div"); b.className = "swapban"; b.innerHTML = `<div class="in">${icon}<b>${txt}</b></div>`; el.appendChild(b); sc.after(2600, () => b.remove()); }
  function endHalf() {
    if (half === 0) { SFX.bell(); banner("Swap!", ICON.swap); half = 1; newTimer(); el.dataset.state = "swap"; sc.after(3000, () => { if (half === 1 && !timer.running && !timer.ended) { timer.toggle(); el.dataset.state = "running"; } }); }
    else { SFX.chime(); banner("Time’s up!", ICON.flag); el.dataset.state = "done"; }
  }
  function toggle() { if (!timer || timer.ended) return false; timer.toggle(); el.dataset.state = timer.running ? "running" : "paused"; return true; }
  function swapNow() { if (half !== 0 || !timer || timer.ended) return false; timer.finish(); return true; }
  const onResize = () => { if (step === 1) { if (half === 1) place(0, 1); } };
  addEventListener("resize", onResize);
  render();
  return {
    keys: () => step === 0 ? [["Space", heShown ? "Hebrew off" : "Hebrew rules", true]]
      : [["Space", timer && timer.running ? "pause" : "start", !!timer && !timer.ended], ["X", "swap now", half === 0 && !!timer && !timer.ended]],
    onKey(k) {
      if (step === 0 && k === " ") return toggleHe(), true;
      if (step === 1 && k === " ") return toggle();
      if (step === 1 && k === "x") return swapNow();
      if (k === "ArrowRight" && step === 0) { step = 1; render(); return true; }
      if (k === "ArrowLeft" && step === 1) { step = 0; render(); return true; }
    },
    stop() { removeEventListener("resize", onResize); }
  };
};

/* 12. Snake chain: the snake grows one picture per word (C: a new row starts again) → What did we learn today? (ticks) → bye-bye; → / ← between the three */
let ALL_DONE = false;
GAMES.chain = (el, sc) => {
  let added = [], step = 0, ticks = 0, answered = false;
  const headSVG = () => V("0 0 170 130", `<path d="M136 70 H156 L163 63 M156 70 L163 77" fill="none" stroke="${P.red}" stroke-width="5"/><ellipse cx="80" cy="64" rx="66" ry="50" fill="${P.green}" stroke-width="7"/><path d="M40 34 Q60 20 84 22" fill="none" stroke="#fff" stroke-width="6" opacity=".7"/><circle cx="76" cy="44" r="15" fill="#fff" stroke-width="5"/><circle cx="110" cy="46" r="15" fill="#fff" stroke-width="5"/><circle cx="80" cy="46" r="7" fill="${INK}" stroke="none"/><circle cx="114" cy="48" r="7" fill="${INK}" stroke="none"/><circle cx="56" cy="76" r="9" fill="${P.pink}" stroke="none"/><path d="M84 84 Q102 98 124 80" fill="none" stroke-width="6"/>`);
  const tailSVG = () => V("0 0 90 60", `<path d="M86 14 Q40 18 6 40 Q44 44 86 46 Z" fill="${P.green}" stroke-width="5"/>`);
  function render() {
    if (step === 0) {
      el.innerHTML = `<div class="chainwrap"><div class="chain"><div class="body"></div><div class="tail">${tailSVG()}</div><div class="segs" style="display:flex;align-items:center">${added.map(id => `<div class="seg">${pcard(id, { label: true })}</div>`).join("")}</div><div class="head">${headSVG()}</div></div>
        <div class="bank">${WIDS.map(id => `<button class="btn white" data-word="${id}" ${added.includes(id) ? "disabled" : ""}><span>${wHTML(id)}</span></button>`).join("")}</div>${heLine(H.chain)}</div>`;
      $$(".bank .btn", el).forEach(b => b.onclick = () => add(b.dataset.word));
      setItem(el, added.length, "chain");
    } else if (step === 1) {
      el.innerHTML = `<div class="learn card tape" style="padding:4vh 3vw"><h1>${T.learn}</h1><p class="ans" ${answered ? "" : 'style="visibility:hidden"'}>${T.learnAns.replace("S,", '<span class="sl">S</span>,').replace("Snake", wHTML("Snake"))}</p>${agendaBig(ticks)}</div>`;
      setItem(el, 6, answered ? "ticked" + ticks : "learn");
    } else {
      el.innerHTML = `<div class="bye"><h1>${curly(T.bye).replace("S words", '<span class="sl">S</span> words')}</h1>${V("0 0 400 260", `${sky()}${grass(206)}${sunG(352, 40, 20)}<g transform="translate(96 244) scale(.98)">${samG({ pose: "wave", face: "grin" })}</g><g transform="translate(150 112) scale(.95)">${snakeH("joy")}</g>${starG(330, 140, 26, 4.5)}${heart(240, 60, 1.3)}`)}</div>`;
      setItem(el, 7, "bye"); speak(T.bye); confetti(); SFX.cheer();
    }
    topAgenda();
  }
  function add(id) {
    if (step !== 0) return false;
    id = id || WIDS.find(x => !added.includes(x)); if (!id || added.includes(id)) return false;
    added.push(id);
    const s = document.createElement("div"); s.className = "seg"; s.innerHTML = pcard(id, { label: true }); $(".segs", el).appendChild(s);
    $(`.bank [data-word="${id}"]`, el).disabled = true; restart($(".head", el), "bounce");
    speak(id); setItem(el, added.length, "chain");
    if (added.length === WIDS.length) sc.after(700, () => { confettiAt($(".head", el)); SFX.hiss(1.6); SFX.cheer(); });
    return true;
  }
  function space() {
    if (step === 0) return add();
    if (step === 1) {
      if (!answered) { answered = true; const a = $(".ans", el); a.style.visibility = "visible"; restart(a, "pop"); SFX.hiss(1.4); el.dataset.state = "answer"; return true; }
      if (ticks < LESSON.agenda.length) { ticks++; const b = $$(".agb", el)[ticks - 1]; b.classList.add("done"); SFX.sparkle(); el.dataset.state = "ticked" + ticks; if (ticks === LESSON.agenda.length) { ALL_DONE = true; topAgenda(); } return true; }
    }
    return false;
  }
  // C: a new row starts the snake again (each row says all the words)
  function reset() { if (step !== 0 || !added.length) return false; added = []; render(); SFX.whoosh(); return true; }
  render();
  return {
    keys: () => step === 0 ? [["Space", "next word", added.length < WIDS.length], ["C", "new row", added.length > 0]]
      : step === 1 ? [["Space", !answered ? "show the answer" : "tick the next part", !answered || ticks < LESSON.agenda.length]] : [],
    onKey(k) {
      if (k === "c") return reset();
      if (isGo(k)) return space();
      if (k === "ArrowRight") { if (step >= 2) return false; step++; render(); return true; }
      if (k === "ArrowLeft") { if (step <= 0) return false; step--; render(); return true; }
    },
    stop() { ALL_DONE = false; }
  };
};

/* =====================================================================
   SHELL: top bar, agenda, menu, keys
   ===================================================================== */
const screenEl = $("#screen");
let cur = 0, ctrl = {}, scope = null;
function topAgenda() {
  const ag = STAGES[cur].ag;
  $$("#agenda .agi").forEach((b, k) => { b.classList.toggle("done", ALL_DONE || k < ag); b.classList.toggle("cur", !ALL_DONE && k === ag); });
}
function go(i) {
  i = Math.max(0, Math.min(STAGES.length - 1, i));
  if (ctrl.stop) ctrl.stop(); if (scope) scope.stop();
  hush(); $$(".swapban,.eyes").forEach(x => x.remove());
  cur = i; ALL_DONE = false;
  const st = STAGES[i];
  scope = makeScope();
  screenEl.innerHTML = ""; screenEl.className = "g-" + st.game; for (const k of Object.keys(screenEl.dataset)) delete screenEl.dataset[k];
  screenEl.dataset.game = st.game; screenEl.dataset.stage = i + 1;
  ctrl = GAMES[st.game](screenEl, scope, st) || {};
  drawLegend();
  $("#stNum").textContent = i + 1;
  $("#stName").textContent = curly(st.name);
  topAgenda();
  $$(".mstage").forEach((b, k) => b.classList.toggle("cur", k === i));
  history.replaceState(null, "", location.search + "#" + (i + 1));
}
const nextStage = () => { if (cur < STAGES.length - 1) go(cur + 1); };
const prevStage = () => { if (cur > 0) go(cur - 1); };
// the key legend: what each key does right now; keys that can't act are greyed
function drawLegend() {
  const ks = [...(ctrl.keys ? ctrl.keys() : []), ["R", "again", !!lastSpoken], ["PgDn", "next part", cur < STAGES.length - 1]];
  $("#legend").innerHTML = ks.map(([key, what, on]) => `<span class="${on ? "" : "off"}" data-k="${key.toLowerCase()}"><span class="kbd">${key}</span> ${what}</span>`).join("");
}
new MutationObserver(drawLegend).observe(screenEl, { attributes: true });
// a press that did nothing: the legend flashes, with the key that would act (PgDn at a stage's end)
let nudgeT = null;
function nudge(key) {
  const lg = $("#legend"); drawLegend();
  lg.classList.remove("nudge"); void lg.offsetWidth; lg.classList.add("nudge");
  if (key) $(`[data-k="${key}"]`, lg)?.classList.add("hot");
  clearTimeout(nudgeT); nudgeT = setTimeout(() => lg.classList.remove("nudge"), 1400);
}

$("#logo").innerHTML = LOGO;
$("#menuBtn").innerHTML = ICON.menu; $("#prevBtn").innerHTML = ICON.prev; $("#nextBtn").innerHTML = ICON.next; $("#fsBtn").innerHTML = ICON.fs; $("#closeMenu").innerHTML = ICON.close;
// the top-bar arrows move between stages; the keyboard arrows move through a stage's items and stop at its ends
$("#prevBtn").onclick = prevStage;
$("#nextBtn").onclick = nextStage;
const toggleFS = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
$("#fsBtn").onclick = toggleFS;
$("#agenda").innerHTML = LESSON.agenda.map(a => `<div class="agi" title="${a.name}" data-ag="${a.id}">${AGI[a.id]()}<i class="tk">${ICON.tick}</i></div>`).join("");
// an agenda icon jumps to the first stage of that part (the teacher's mouse; kids never tap the top bar)
$$("#agenda .agi").forEach((b, k) => b.onclick = () => { const s = STAGES.findIndex(x => x.ag === k); if (s >= 0) go(s); });
const testSound = () => { SFX.ding(); setTimeout(() => speak(T.hello), 400); };
$("#testSound").innerHTML = `${ICON.speaker} Test sound`; $("#testSound").onclick = testSound;
$("#menuGrid").innerHTML = STAGES.map((s, k) => `<button class="mstage"><span class="n">${k + 1}</span><span><b>${curly(s.name)}</b><small>${s.net} min</small></span></button>`).join("");
$$(".mstage").forEach((b, k) => b.onclick = () => { closeMenu(); go(k); });
const totalNet = STAGES.reduce((t, s) => t + s.net, 0);
$("#totalNet").textContent = totalNet;
$("#menuKeys").innerHTML = `<span class="kbd">1</span>–<span class="kbd">9</span>, <span class="kbd">1</span><span class="kbd">0</span>–<span class="kbd">1</span><span class="kbd">${STAGES.length % 10}</span> jump to a stage · <span class="kbd">PgDn</span> <span class="kbd">PgUp</span> or the top-bar arrows: next / previous stage · <span class="kbd">→</span> <span class="kbd">←</span> next / previous item, never past the stage · <span class="kbd">Space</span> the next step (the corner legend says which) · <span class="kbd">R</span> say it again · <span class="kbd">F</span> full screen · <span class="kbd">M</span> this menu`;
$("#clockRule").innerHTML = `${ICON.clock.replace("<svg", '<svg style="width:1.1em;height:1.1em;display:inline;vertical-align:-.2em"')} The pair game (${STAGES.findIndex(s => s.game === "mime") + 1}) starts at least 8 minutes before the bell. Running late? See the plan.`;
const menuEl = $("#menu");
const openMenu = () => { menuEl.hidden = false; }, closeMenu = () => { menuEl.hidden = true; };
$("#menuBtn").onclick = () => menuEl.hidden ? openMenu() : closeMenu();
$("#closeMenu").onclick = closeMenu;
menuEl.onclick = e => { if (e.target === menuEl) closeMenu(); };

// keyboard: 1–12 (two digits for 10–12), PageUp / PageDown = stage, arrows = items, Space = next step, stage letters
let dbuf = "", dtimer = null;
function digit(d) {
  clearTimeout(dtimer);
  if (dbuf === "" && d !== "1") { if (d !== "0") { closeMenu(); go(+d - 1); } return; }
  dbuf += d;
  if (dbuf.length === 2) { const n = +dbuf; dbuf = ""; if (n >= 1 && n <= STAGES.length) { closeMenu(); go(n - 1); } return; }
  dtimer = setTimeout(() => { dbuf = ""; closeMenu(); go(0); }, 700);
}
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; ac();
  if ([" ", "Enter", "Backspace", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "PageUp", "PageDown"].includes(k)) e.preventDefault();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  if (e.repeat) return;   // a held key never runs on
  if (k === "f") return toggleFS();
  if (k === "m") return menuEl.hidden ? openMenu() : closeMenu();
  if (k === "Escape") return closeMenu();
  if (/^[0-9]$/.test(k)) return digit(k);
  if (k === "PageDown" || k === "PageUp") { closeMenu(); return k === "PageDown" ? nextStage() : prevStage(); }
  if (!menuEl.hidden) return;
  if (k === "r") return lastSpoken ? speak(lastSpoken) : nudge("r");
  if (ctrl.onKey && ctrl.onKey(k, e)) return drawLegend();
  if (k === "ArrowRight") return nudge("pgdn");
  if (k === " " || k === "Enter" || k === "ArrowLeft" || (ctrl.keys && ctrl.keys().some(([key]) => key.toLowerCase() === k))) nudge(k === " " ? "space" : k.length === 1 ? k : null);
});
addEventListener("pointerdown", () => ac(), { once: true });
addEventListener("resize", () => { CV.width = innerWidth; CV.height = innerHeight; });
if (document.fonts && document.fonts.load) { document.fonts.load('700 40px "Fredoka"'); document.fonts.load('500 30px "Rubik"', "אבג"); }
{ const m = /^#(\d+)/.exec(location.hash); go(m ? +m[1] - 1 : 0); }
